<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.png">
    <script defer src="script.js"></script>
</head>

<body>
    <h1 class="title">Caesar Cipher</h1>
    <br>
    <ol class="options">
        <li>
            <button onclick="window.open('cipher')">
                <span>Cipher Raw Text</span>
            </button>
        </li>
        <li>
            <button onclick="window.open('decipher')">
                <span>Decipher Ciphered Text</span>
            </button>
        </li>
        <li>
            <button onclick="window.open('crack')">
                <span>Crack Ciphered Text</span>
            </button>
        </li>
        <li>
            <button onclick="window.open('https://npmjs.com/js-caesarcipher')">
                <span>Caesar Cipher package on npm </span>
            </button>
        </li>
        <li>
            <button onclick="window.open('https://studio.code.org/projects/applab/19fd3b3d-a700-4856-806b-dac4b34632cc')">
                <span>Code.org Caesar Cipher App Lab project</span>
            </button>
        </li>
    </ol>
</body>

</html>
