<!DOCTYPE html>
<html>

<head>
    <link rel="icon" href="../icon.png">
    <link rel="apple-touch-icon" href="../icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/js-caesarcipher@1.1.5/script.js"></script>
    <script defer src="script.js"></script>
    <title>Caesar Cipher - Deipher ciphered text</title>
</head>

<body>
    <h1 class="title">Caesar Cipher</h1>
    <div class="main">
        <p class="subtitle">Deipher ciphered text</p>
        <textarea id="input" placeholder="Ciphered Text"></textarea>
        <br>
        <div class="form">
            <input id="shift" placeholder="Shift" min="0" max="26" type="number">
            <button id="decipher">Deipher text</button>
        </div>
        <textarea id="display" readonly></textarea>
    </div>
</body>

</html>
